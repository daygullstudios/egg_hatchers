name: Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2f # v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Verify rebrand compatibility inventory
        run: node tool/audit_brand.mjs

      - name: Verify release evidence index
        run: node tool/audit_release_evidence.mjs

      - name: Verify release decision packet
        run: node tool/audit_release_decisions.mjs

      - name: Verify public policy and support links
        run: node tool/audit_public_policy_links.mjs

      - name: Verify asset rights inventory
        run: node tool/audit_asset_rights.mjs

      - name: Verify audio release readiness
        run: node tool/audit_audio_release.mjs

      - name: Verify platform branding readiness
        run: node tool/audit_platform_branding.mjs

      - name: Verify platform store readiness
        run: node tool/audit_platform_store.mjs

      - name: Verify multiplayer production readiness
        run: node tool/audit_multiplayer_production.mjs

      - name: Verify monitoring operations readiness
        run: node tool/audit_monitoring_operations.mjs

      - name: Verify operations dry-run checklist
        run: node tool/audit_operations_dry_run.mjs

      - name: Verify release reliability evidence
        run: node tool/audit_release_reliability.mjs

      - name: Verify release code review evidence
        run: node tool/audit_release_code_review.mjs

      - name: Verify security review evidence
        run: node tool/audit_security_review.mjs

      - name: Verify cross-platform acceptance template
        run: node tool/audit_cross_platform_acceptance.mjs

      - name: Verify closed beta readiness template
        run: node tool/audit_closed_beta_readiness.mjs

      - name: Verify rollback rehearsal template
        run: node tool/audit_rollback_rehearsal.mjs

      - name: Verify release candidate record template
        run: node tool/audit_release_candidate_record.mjs

      - name: Verify monetization remains dormant
        run: node tool/audit_monetization_boundary.mjs

      - name: Verify family privacy gate evidence
        run: node tool/audit_family_privacy_gate.mjs

      - name: Verify gameplay economy evidence
        run: node tool/audit_gameplay_economy.mjs

      - name: Verify custom eggs are retired
        run: node tool/audit_custom_eggs_retired.mjs

      - name: Verify isolated public information site
        working-directory: cloudflare/public-site
        run: npm test

      - name: Test
        run: flutter test

      - name: Build web release
        run: flutter build web --release --no-pub

      - name: Verify developer tools are absent from release
        run: node tool/audit_release_surface.mjs

      - name: Build multiplayer server
        run: dart compile exe tool/multiplayer_server.dart -o build/nestarium-server

      - name: Package hosted release
        run: |
          mkdir -p build/deploy/build
          cp build/nestarium-server build/deploy/nestarium-server
          cp -R build/web build/deploy/build/web
          tar -C build/deploy -czf build/nestarium-linux-x64.tar.gz .

      - name: Upload hosted release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nestarium-linux-x64
          path: build/nestarium-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Verify deployment container
        run: |
          docker build --tag nestarium:verify .
          docker run --detach --name nestarium-verify \
            --publish 18080:10000 nestarium:verify
          trap 'docker rm --force nestarium-verify' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs nestarium-verify
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/ | grep --quiet "Nestarium"
