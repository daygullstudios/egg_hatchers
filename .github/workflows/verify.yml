name: Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2f # v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web release
        run: flutter build web --release --no-pub

      - name: Build multiplayer server
        run: dart compile exe tool/multiplayer_server.dart -o build/egg-hatchers-server

      - name: Package hosted release
        run: |
          mkdir -p build/deploy/build
          cp build/egg-hatchers-server build/deploy/egg-hatchers-server
          cp -R build/web build/deploy/build/web
          tar -C build/deploy -czf build/egg-hatchers-linux-x64.tar.gz .

      - name: Upload hosted release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: egg-hatchers-linux-x64
          path: build/egg-hatchers-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Verify deployment container
        run: |
          docker build --tag egg-hatchers:verify .
          docker run --detach --name egg-hatchers-verify \
            --publish 18080:10000 egg-hatchers:verify
          trap 'docker rm --force egg-hatchers-verify' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs egg-hatchers-verify
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/ | grep --quiet "Egg Hatchers"
