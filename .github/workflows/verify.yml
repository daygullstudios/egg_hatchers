name: Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2f # v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web release
        run: flutter build web --release --no-pub

      - name: Build multiplayer server
        run: dart compile exe tool/multiplayer_server.dart -o build/egg-hatchers-server

      - name: Package hosted release
        run: |
          mkdir -p build/deploy/build
          cp build/egg-hatchers-server build/deploy/egg-hatchers-server
          cp -R build/web build/deploy/build/web
          tar -C build/deploy -czf build/egg-hatchers-linux-x64.tar.gz .

      - name: Upload hosted release
        uses: actions/upload-artifact@043fb46d1a93c77aae6567c1c64a875d1fc6a0a # v7.0.1
        with:
          name: egg-hatchers-linux-x64
          path: build/egg-hatchers-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
